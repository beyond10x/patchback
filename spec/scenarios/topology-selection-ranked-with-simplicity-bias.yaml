# DESIGN.md 5.4, 9.3, 13 D, ADR-003, ADR-009: candidates are ranked by audible match plus an
# explicit complexity penalty, and the ranking is transparent. A three-node candidate (loss 0.40,
# penalty 0.02, score 0.42) outranks an eight-node candidate with lower loss (0.38, penalty 0.08,
# score 0.46). The penalty values are illustrative: its formula is UNMAPPED (fit.yaml, Candidate).
type: ess-scenario/1
domain: patchback.fit
scenario: topology-selection-ranked-with-simplicity-bias
summary: Two candidates are proposed with loss, penalty and score published; selecting the larger, lower-loss one is refused with BetterCandidateExists and the simpler one is Selected.

arrange:
  - instance: reference
    entity: patchback.audio.AudioClip
  - instance: run
    entity: patchback.fit.FitRun
  - instance: simple
    entity: patchback.fit.Candidate
  - instance: complex
    entity: patchback.fit.Candidate

timeline:
  - at: 2026-10-22T00:00:01Z
    command: patchback.patch.DeclareTopology
    actor: patchback.patch.Operator
    input:
      topology_id: 6bc27f50-0000-4000-8000-000000000003
      name: subtractive-mono/1
      parameters: []
    outcome: declared

  - at: 2026-10-22T00:00:02Z
    command: patchback.patch.LoadPatch
    actor: patchback.patch.Operator
    input:
      patch_id: 6bc27f50-0000-4000-8000-0000000000f1
      format_version: 1
      sample_rate_hz: 48000
      topology_id: 6bc27f50-0000-4000-8000-000000000003
      nodes:
        - {id: 2, kind: SawOscillator, parameters: []}
      edges: []
    outcome: loaded

  - at: 2026-10-22T00:00:03Z
    command: patchback.score.LoadNoteSequence
    actor: patchback.score.Operator
    input:
      note_sequence_id: 6bc27f50-0000-4000-8000-000000000002
      format_version: 1
      sample_rate_hz: 48000
      patch_id: 6bc27f50-0000-4000-8000-0000000000f1
      notes:
        - {start_sample: 0, end_sample: 24000, midi_note: 45, velocity: 0.8}
    outcome: loaded

  - at: 2026-10-22T00:00:04Z
    command: patchback.audio.ImportWav
    actor: patchback.audio.Operator
    input:
      path: reference.wav
      origin: PatchbackSynthesized
      sample_rate_hz: 48000
      channel_count: 1
      format_tag: 3
      bits_per_sample: 32
      frame_count: 48000
    outcome: imported
    capture: {instance: reference, event: patchback.audio.ClipImported, field: audio_clip_id}

  - at: 2026-10-22T17:00:00Z
    command: patchback.fit.StartFit
    actor: patchback.fit.Operator
    input:
      reference_clip_id: {$instance: reference}
      note_sequence_id: 6bc27f50-0000-4000-8000-000000000002
      note_source: Known
      scope: SingleNote
      topology_id: 6bc27f50-0000-4000-8000-000000000003
      seed: 42
      max_renders: 2000
      max_wall_time_ms: 600000
      max_restarts: 4
      improvement_threshold: 0.001
    outcome: started
    capture: {instance: run, event: patchback.fit.FitStarted, field: fit_run_id}

  - at: 2026-10-22T17:00:01Z
    command: patchback.fit.ProposeCandidate
    actor: patchback.fit.Optimizer
    input:
      fit_run_id: {$instance: run}
      topology_id: 6bc27f50-0000-4000-8000-000000000010
      patch_id: 6bc27f50-0000-4000-8000-000000000020
      loss: 0.40
      node_count: 3
      edge_count: 2
      control_route_count: 1
      complexity_penalty: 0.02
    outcome: proposed
    events:
      - event: patchback.fit.CandidateProposed
        payload:
          loss: 0.40
          complexity_penalty: 0.02
          score: 0.42
    capture: {instance: simple, event: patchback.fit.CandidateProposed, field: candidate_id}

  - at: 2026-10-22T17:00:02Z
    command: patchback.fit.ProposeCandidate
    actor: patchback.fit.Optimizer
    input:
      fit_run_id: {$instance: run}
      topology_id: 6bc27f50-0000-4000-8000-000000000011
      patch_id: 6bc27f50-0000-4000-8000-000000000021
      loss: 0.38
      node_count: 8
      edge_count: 9
      control_route_count: 4
      complexity_penalty: 0.08
    outcome: proposed
    events:
      - event: patchback.fit.CandidateProposed
        payload:
          loss: 0.38
          complexity_penalty: 0.08
          score: 0.46
    capture: {instance: complex, event: patchback.fit.CandidateProposed, field: candidate_id}

  - at: 2026-10-22T17:00:03Z
    command: patchback.fit.SelectCandidate
    actor: patchback.fit.Operator
    input:
      candidate_id: {$instance: complex}
    outcome: outranked
    error:
      name: patchback.fit.BetterCandidateExists

  - at: 2026-10-22T17:00:04Z
    command: patchback.fit.SelectCandidate
    actor: patchback.fit.Operator
    input:
      candidate_id: {$instance: simple}
    outcome: selected
    events:
      - event: patchback.fit.CandidateSelected
