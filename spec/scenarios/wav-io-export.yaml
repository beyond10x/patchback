# DESIGN.md 13 Milestone A: "std-only WAV input/output"; 12.1: "valid PCM16/f32 roundtrip".
# The byte-level roundtrip is a numeric obligation, not part of this scenario.
type: ess-scenario/1
domain: patchback.audio
scenario: wav-io-export
summary: An imported clip is written as PCM16 and as float32 WAV; exporting a clip nobody imported is refused.

arrange:
  - instance: clip
    entity: patchback.audio.AudioClip
  - instance: pcm16-file
    entity: patchback.audio.WavFile
  - instance: f32-file
    entity: patchback.audio.WavFile

timeline:
  - at: 2026-10-22T09:00:00Z
    command: patchback.audio.ImportWav
    actor: patchback.audio.Operator
    input:
      path: reference.wav
      origin: PatchbackSynthesized
      sample_rate_hz: 48000
      channel_count: 1
      format_tag: 3
      bits_per_sample: 32
      frame_count: 48000
    outcome: imported
    capture: {instance: clip, event: patchback.audio.ClipImported, field: audio_clip_id}

  - at: 2026-10-22T09:00:01Z
    command: patchback.audio.ExportWav
    actor: patchback.audio.Operator
    input:
      audio_clip_id: {$instance: clip}
      path: out-pcm16.wav
      sample_format: Pcm16
    outcome: exported
    events:
      - event: patchback.audio.WavExported
        payload:
          sample_format: Pcm16
    capture: {instance: pcm16-file, event: patchback.audio.WavExported, field: wav_file_id}

  - at: 2026-10-22T09:00:02Z
    command: patchback.audio.ExportWav
    actor: patchback.audio.Operator
    input:
      audio_clip_id: {$instance: clip}
      path: out-f32.wav
      sample_format: Float32
    outcome: exported
    events:
      - event: patchback.audio.WavExported
        payload:
          sample_format: Float32
    capture: {instance: f32-file, event: patchback.audio.WavExported, field: wav_file_id}

  - at: 2026-10-22T09:00:03Z
    command: patchback.audio.ExportWav
    actor: patchback.audio.Operator
    input:
      audio_clip_id: 7d1c2f40-0000-4000-8000-000000000001
      path: out-missing.wav
      sample_format: Pcm16
    outcome: no-such-clip
    error:
      name: patchback.audio.ClipNotFound
