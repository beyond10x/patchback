# DESIGN.md 11: the .events parser rejects malformed numbers and unbounded lengths; 12.3 bounds the
# note count. Both are the parser's findings (external in score.yaml, UNMAPPED: no grammar or
# bound value is given), reached once the patch exists at the sequence's rate.
type: ess-scenario/1
domain: patchback.score
scenario: note-events-parser-refusals
summary: A .events file with a malformed number and one past the parser's length bound are each refused and load no sequence.

timeline:
