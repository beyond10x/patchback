      scope: SingleNote
      topology_id: 0b6e7d1a-0000-4000-8000-000000000403
      seed: 42
      max_renders: 2000
      max_wall_time_ms: 600000
      max_restarts: 4
      improvement_threshold: 0.001
    outcome: unknown-topology
