# DESIGN.md 10 V1 and Milestone C: monophonic onset, pitch, gate-length and tail estimates; 6.1:
# for external monophonic audio they are "estimated and emitted with confidence scores".
type: ess-scenario/1
domain: patchback.analysis
scenario: note-estimation-estimated
summary: A monophonic phrase is estimated into notes, each with its onset, pitch, gate and tail confidence.

arrange:
  - instance: analysis
    entity: patchback.analysis.Analysis
  - instance: estimation
    entity: patchback.analysis.NoteEstimation

timeline:
  - at: 2026-10-22T09:00:00Z
    command: patchback.analysis.AnalyzeAudio
    actor: patchback.analysis.Operator
    input:
      audio_clip_id: 0a1b2c3d-0000-4000-8000-000000000021
      out_dir: analysis/
      sample_rate_hz: 48000
      frame_count: 96000
      fft_lengths: [512, 2048, 8192]
      hop_length: 512
      window: Hann
    outcome: analyzed
    capture: {instance: analysis, event: patchback.analysis.AudioAnalyzed, field: analysis_id}

  - at: 2026-10-22T09:00:01Z
    command: patchback.analysis.EstimateNotes
    actor: patchback.analysis.Operator
    input:
      audio_clip_id: 0a1b2c3d-0000-4000-8000-000000000021
      analysis_id: {$instance: analysis}
    outcome: estimated
    capture: {instance: estimation, event: patchback.analysis.NotesEstimated, field: note_estimation_id}
