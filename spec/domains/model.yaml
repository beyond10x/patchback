        type: patchback.model.WeightArtifact.State
      - name: training_run_id
        type: patchback.model.TrainingRunId
      - name: model_spec_pin_id
        type: patchback.model.ModelSpecPinId
      - name: feature_contract_id
        type: patchback.analysis.FeatureContractId
      - name: checksum
        type: patchback.model.WeightChecksum
      - name: clamped_predictions
        type: Integer
    naming:
      wire: weight-artifacts
      display: Weight artifacts
