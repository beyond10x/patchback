# DESIGN.md 8.2 step 1: the run's exit status decides it; a non-zero status fails it. 1.1: Vulkan
# "is on the roadmap and must not be treated as working today", so a Vulkan run under a pin that
# does not list it as shipped is refused. Train x.f32 is 50,016 × 32 × 4 = 6,402,048 bytes and
# y.f32 50,016 × 8 × 4 = 1,600,512 bytes.
type: ess-scenario/1
domain: patchback.model
scenario: training-run-failed-and-vulkan-refused
summary: A Vulkan run under a pin without a shipped Vulkan backend is refused; a CPU run exiting 1 is Failed and takes no second exit status.

arrange:
  - instance: pin
    entity: patchback.model.ModelSpecPin
  - instance: source
    entity: patchback.model.ModelSource
  - instance: dataset
    entity: patchback.dataset.Dataset
  - instance: train
    entity: patchback.dataset.DatasetSplit
  - instance: run
    entity: patchback.model.TrainingRun

timeline:
  - at: 2026-10-22T12:30:00Z
    command: patchback.model.PinModelSpec
    actor: patchback.model.Operator
    input:
      version: pinned-release
      commit: 0123456789abcdef0123456789abcdef01234567
      vulkan_backend_shipped: false
    outcome: pinned
    capture: {instance: pin, event: patchback.model.ModelSpecPinned, field: model_spec_pin_id}

  - at: 2026-10-22T12:30:01Z
    command: patchback.model.PlanTrainingRun
    actor: patchback.model.Operator
    input:
      model_spec_pin_id: {$instance: pin}
      backend: Vulkan
    outcome: backend-not-shipped
    error:
      name: patchback.model.BackendNotShipped

  - at: 2026-10-22T12:30:02Z
    command: patchback.model.RegisterModelSource
    actor: patchback.model.Operator
    input:
      path: models/patch_regressor.mspec
      model_name: PatchRegressor
      batch_size: 16
      model_spec_pin_id: {$instance: pin}
    outcome: registered
    capture: {instance: source, event: patchback.model.ModelSourceRegistered, field: model_source_id}

  - at: 2026-10-22T12:30:03Z
    command: patchback.model.CheckModelSource
    actor: patchback.model.Operator
    input:
      model_source_id: {$instance: source}
    outcome: checked

  - at: 2026-10-22T12:30:04Z
    command: patchback.dataset.GenerateDataset
    actor: patchback.dataset.Operator
    input:
      seed: 42
      prng_algorithm: std-only-generator
      batch_size: 16
      feature_contract_id: 6e000000-0000-4000-8000-000000000001
      topology_id: 6e000000-0000-4000-8000-000000000002
      out_dir: data/
    outcome: generated
    capture: {instance: dataset, event: patchback.dataset.DatasetGenerated, field: dataset_id}

  - at: 2026-10-22T12:30:05Z
    command: patchback.dataset.OpenSplit
    actor: patchback.dataset.Operator
    input:
      dataset_id: {$instance: dataset}
      role: Train
      sample_count: 50016
    outcome: opened
    capture: {instance: train, event: patchback.dataset.SplitOpened, field: dataset_split_id}

  - at: 2026-10-22T12:30:06Z
    command: patchback.dataset.WriteDenseFile
    actor: patchback.dataset.Operator
    input:
      dataset_split_id: {$instance: train}
      kind: X
      path: data/train/x.f32
      rows: 50016
      columns: 32
      byte_count: 6402048
    outcome: written

  - at: 2026-10-22T12:30:07Z
    command: patchback.dataset.WriteDenseFile
    actor: patchback.dataset.Operator
    input:
      dataset_split_id: {$instance: train}
      kind: Y
      path: data/train/y.f32
      rows: 50016
      columns: 8
      byte_count: 1600512
    outcome: written

  - at: 2026-10-22T12:30:08Z
    command: patchback.dataset.FinishSplit
    actor: patchback.dataset.Operator
    input:
      dataset_split_id: {$instance: train}
    outcome: written

  - at: 2026-10-22T12:30:09Z
    command: patchback.model.PlanTrainingRun
    actor: patchback.model.Operator
    input:
      model_spec_pin_id: {$instance: pin}
      backend: Cpu
    outcome: planned
    capture: {instance: run, event: patchback.model.TrainingRunPlanned, field: training_run_id}

  - at: 2026-10-22T12:30:10Z
    command: patchback.model.BindModelSource
    actor: patchback.model.Operator
    input:
      training_run_id: {$instance: run}
      model_source_id: {$instance: source}
    outcome: bound

  - at: 2026-10-22T12:30:11Z
    command: patchback.model.StartTrainingRun
    actor: patchback.model.Operator
    input:
      training_run_id: {$instance: run}
      data_split_id: {$instance: train}
      eval_split_id: null
    outcome: started

  - at: 2026-10-22T12:30:12Z
    command: patchback.model.FinishTrainingRun
    actor: patchback.model.Operator
    input:
      training_run_id: {$instance: run}
      exit_status: 1
    outcome: failed

  - at: 2026-10-22T12:30:13Z
    command: patchback.model.FinishTrainingRun
    actor: patchback.model.Operator
    input:
      training_run_id: {$instance: run}
      exit_status: 0
    outcome: wrong-state
    error:
      name: patchback.model.TrainingRunFinished
