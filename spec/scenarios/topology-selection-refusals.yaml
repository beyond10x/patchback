# DESIGN.md 5.4 (a patch has at least one node), 9.3 and 13 D: an empty candidate graph is refused,
# a candidate for a run that is no longer Running is refused, an unknown candidate cannot be
# selected, and a candidate already Selected cannot be selected again.
type: ess-scenario/1
domain: patchback.fit
scenario: topology-selection-refusals
summary: Empty graphs, unknown candidates, second selections and candidates for a failed run are each refused with a typed error.

arrange:
  - instance: reference
    entity: patchback.audio.AudioClip
  - instance: run
    entity: patchback.fit.FitRun
  - instance: only
    entity: patchback.fit.Candidate

timeline:
  - at: 2026-10-22T00:00:01Z
    command: patchback.patch.DeclareTopology
    actor: patchback.patch.Operator
    input:
      topology_id: 6bc27f50-0000-4000-8000-000000000103
      name: subtractive-mono/1
      parameters: []
    outcome: declared

  - at: 2026-10-22T00:00:02Z
    command: patchback.patch.LoadPatch
    actor: patchback.patch.Operator
    input:
      patch_id: 6bc27f50-0000-4000-8000-0000000001f1
      format_version: 1
      sample_rate_hz: 48000
      topology_id: 6bc27f50-0000-4000-8000-000000000103
      nodes:
        - {id: 2, kind: SawOscillator, parameters: []}
      edges: []
    outcome: loaded

  - at: 2026-10-22T00:00:03Z
    command: patchback.score.LoadNoteSequence
    actor: patchback.score.Operator
    input:
      note_sequence_id: 6bc27f50-0000-4000-8000-000000000102
      format_version: 1
      sample_rate_hz: 48000
      patch_id: 6bc27f50-0000-4000-8000-0000000001f1
      notes:
        - {start_sample: 0, end_sample: 24000, midi_note: 45, velocity: 0.8}
    outcome: loaded

  - at: 2026-10-22T00:00:04Z
    command: patchback.audio.ImportWav
    actor: patchback.audio.Operator
    input:
      path: reference.wav
      origin: PatchbackSynthesized
      sample_rate_hz: 48000
      channel_count: 1
      format_tag: 3
      bits_per_sample: 32
      frame_count: 48000
    outcome: imported
    capture: {instance: reference, event: patchback.audio.ClipImported, field: audio_clip_id}

  - at: 2026-10-22T17:10:00Z
    command: patchback.fit.StartFit
    actor: patchback.fit.Operator
    input:
      reference_clip_id: {$instance: reference}
      note_sequence_id: 6bc27f50-0000-4000-8000-000000000102
      note_source: Known
      scope: SingleNote
      topology_id: 6bc27f50-0000-4000-8000-000000000103
      seed: 42
      max_renders: 2000
      max_wall_time_ms: 600000
      max_restarts: 4
      improvement_threshold: 0.001
    outcome: started
    capture: {instance: run, event: patchback.fit.FitStarted, field: fit_run_id}

  - at: 2026-10-22T17:10:01Z
    command: patchback.fit.ProposeCandidate
    actor: patchback.fit.Optimizer
    input:
      fit_run_id: {$instance: run}
      topology_id: 6bc27f50-0000-4000-8000-000000000110
      patch_id: 6bc27f50-0000-4000-8000-000000000120
      loss: 0.40
      node_count: 0
      edge_count: 0
      control_route_count: 0
      complexity_penalty: 0.0
    outcome: invalid-graph
    error:
      name: patchback.fit.InvalidCandidateGraph

  - at: 2026-10-22T17:10:02Z
    command: patchback.fit.ProposeCandidate
    actor: patchback.fit.Optimizer
    input:
      fit_run_id: {$instance: run}
      topology_id: 6bc27f50-0000-4000-8000-000000000111
      patch_id: 6bc27f50-0000-4000-8000-000000000121
      loss: 0.40
      node_count: 3
      edge_count: 2
      control_route_count: 1
      complexity_penalty: 0.02
    outcome: proposed
    capture: {instance: only, event: patchback.fit.CandidateProposed, field: candidate_id}

  - at: 2026-10-22T17:10:03Z
    command: patchback.fit.SelectCandidate
    actor: patchback.fit.Operator
    input:
      candidate_id: 6bc27f50-0000-4000-8000-000000000199
    outcome: no-such-candidate
    error:
      name: patchback.fit.CandidateNotFound

  - at: 2026-10-22T17:10:04Z
    command: patchback.fit.SelectCandidate
    actor: patchback.fit.Operator
    input:
      candidate_id: {$instance: only}
    outcome: selected

  - at: 2026-10-22T17:10:05Z
    command: patchback.fit.SelectCandidate
    actor: patchback.fit.Operator
    input:
      candidate_id: {$instance: only}
    outcome: wrong-state
    error:
      name: patchback.fit.CandidateStateConflict

  - at: 2026-10-22T17:10:06Z
    command: patchback.fit.FailFit
    actor: patchback.fit.Optimizer
    input:
      fit_run_id: {$instance: run}
      failure_reason: RendererFault
      wall_time_ms: 6000
    outcome: failed

  - at: 2026-10-22T17:10:07Z
    command: patchback.fit.ProposeCandidate
    actor: patchback.fit.Optimizer
    input:
      fit_run_id: {$instance: run}
      topology_id: 6bc27f50-0000-4000-8000-000000000112
      patch_id: 6bc27f50-0000-4000-8000-000000000122
      loss: 0.30
      node_count: 4
      edge_count: 3
      control_route_count: 1
      complexity_penalty: 0.03
    outcome: not-running
    error:
      name: patchback.fit.FitNotRunning
