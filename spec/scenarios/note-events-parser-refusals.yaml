    input:
      patch_id: 7f0c0000-0000-4000-8000-000000000972
      format_version: 1
      sample_rate_hz: 48000
      topology_id: 7f0c0000-0000-4000-8000-000000000971
      nodes:
        - {id: 2, kind: SawOscillator, parameters: []}
      edges: []
    outcome: loaded

  - at: 2026-10-22T09:00:02Z
    command: patchback.score.LoadNoteSequence
    actor: patchback.score.Operator
    input:
      note_sequence_id: 7f0c0000-0000-4000-8000-000000000973
      format_version: 1
      sample_rate_hz: 48000
