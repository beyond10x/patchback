# DESIGN.md section 2 invariant 3: "The DSP graph is validated before compilation or execution."
# A loaded patch that has not passed validation is not compiled, and an unknown patch is refused.
type: ess-scenario/1
domain: patchback.patch
scenario: patch-graph-validation-compile-unvalidated
summary: Compiling a patch that has not been validated, or one that does not exist, is refused.

timeline:
  - at: 2026-10-22T09:00:00Z
    command: patchback.patch.DeclareTopology
    actor: patchback.patch.Operator
    input:
      topology_id: 7f0c0000-0000-4000-8000-000000000012
      name: subtractive-mono/1
      parameters: []
    outcome: declared

  - at: 2026-10-22T09:00:01Z
    command: patchback.patch.LoadPatch
    actor: patchback.patch.Operator
    input:
      patch_id: 7f0c0000-0000-4000-8000-000000000112
      format_version: 1
      sample_rate_hz: 48000
      topology_id: 7f0c0000-0000-4000-8000-000000000012
      nodes:
        - {id: 2, kind: SawOscillator, parameters: []}
        - {id: 7, kind: Output, parameters: [{name: output_gain, value: -6}]}
      edges:
        - {from_node: 2, from_port: out, from_rate: Audio, to_node: 7, to_port: in, to_rate: Audio}
    outcome: loaded

  - at: 2026-10-22T09:00:02Z
    command: patchback.patch.CompilePatch
    actor: patchback.patch.Operator
    input:
      patch_id: 7f0c0000-0000-4000-8000-000000000112
    outcome: not-validated
    error:
      name: patchback.patch.PatchStateConflict
    no_events: [patchback.patch.PatchCompiled]

  - at: 2026-10-22T09:00:03Z
    command: patchback.patch.CompilePatch
    actor: patchback.patch.Operator
    input:
      patch_id: 7f0c0000-0000-4000-8000-000000000199
    outcome: no-such-patch
    error:
      name: patchback.patch.PatchNotFound

assert:
  - view: patchback.patch.Patches
    contains:
      patch_id: 7f0c0000-0000-4000-8000-000000000112
      state: Loaded
