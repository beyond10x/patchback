# DESIGN.md 9.2 step 1: "Initialize from the regressor prediction"; 8: the regressor predicts
# normalized parameters from the analysis feature vector. A fit naming a weight artifact and the
# reference's analysis starts from the prediction, recorded as init RegressorPrediction.
type: ess-scenario/1
domain: patchback.fit
scenario: regressor-seeded-fit-seeded
summary: A fit naming a weight artifact and an analysis starts with init RegressorPrediction; the same fit without a weight artifact starts from DefaultPatch.

arrange:
  - instance: analysis
    entity: patchback.analysis.Analysis
  - instance: reference
    entity: patchback.audio.AudioClip
  - instance: seeded
    entity: patchback.fit.FitRun
  - instance: default
    entity: patchback.fit.FitRun

timeline:
  - at: 2026-10-22T00:00:01Z
    command: patchback.patch.DeclareTopology
    actor: patchback.patch.Operator
    input:
      topology_id: 4fa05d30-0000-4000-8000-000000000003
      name: subtractive-mono/1
      parameters: []
    outcome: declared

  - at: 2026-10-22T00:00:02Z
    command: patchback.patch.LoadPatch
    actor: patchback.patch.Operator
    input:
      patch_id: 4fa05d30-0000-4000-8000-0000000000f1
      format_version: 1
      sample_rate_hz: 48000
      topology_id: 4fa05d30-0000-4000-8000-000000000003
      nodes:
        - {id: 2, kind: SawOscillator, parameters: []}
      edges: []
    outcome: loaded

  - at: 2026-10-22T00:00:03Z
    command: patchback.score.LoadNoteSequence
    actor: patchback.score.Operator
    input:
      note_sequence_id: 4fa05d30-0000-4000-8000-000000000002
      format_version: 1
      sample_rate_hz: 48000
      patch_id: 4fa05d30-0000-4000-8000-0000000000f1
      notes:
        - {start_sample: 0, end_sample: 24000, midi_note: 45, velocity: 0.8}
    outcome: loaded

  - at: 2026-10-22T00:00:04Z
    command: patchback.audio.ImportWav
    actor: patchback.audio.Operator
    input:
      path: reference.wav
      origin: PatchbackSynthesized
      sample_rate_hz: 48000
      channel_count: 1
      format_tag: 3
      bits_per_sample: 32
      frame_count: 48000
    outcome: imported
    capture: {instance: reference, event: patchback.audio.ClipImported, field: audio_clip_id}

  - at: 2026-10-22T00:00:09Z
    command: patchback.analysis.AnalyzeAudio
    actor: patchback.analysis.Operator
    input:
      audio_clip_id: {$instance: reference}
      out_dir: analysis/
      sample_rate_hz: 48000
      frame_count: 48000
      fft_lengths: [512, 2048, 8192]
      hop_length: 512
      window: Hann
    outcome: analyzed
    capture: {instance: analysis, event: patchback.analysis.AudioAnalyzed, field: analysis_id}

  - at: 2026-10-22T15:00:00Z
    command: patchback.fit.StartFit
    actor: patchback.fit.Operator
    input:
      reference_clip_id: {$instance: reference}
      note_sequence_id: 4fa05d30-0000-4000-8000-000000000002
      note_source: Known
      scope: SingleNote
      topology_id: 4fa05d30-0000-4000-8000-000000000003
      weight_artifact_id: 4fa05d30-0000-4000-8000-000000000004
      analysis_id: {$instance: analysis}
      seed: 42
      max_renders: 2000
      max_wall_time_ms: 600000
      max_restarts: 4
      improvement_threshold: 0.001
    outcome: started-seeded
    events:
      - event: patchback.fit.FitStarted
        payload:
          init: RegressorPrediction
    capture: {instance: seeded, event: patchback.fit.FitStarted, field: fit_run_id}

  - at: 2026-10-22T15:00:01Z
    command: patchback.fit.StartFit
    actor: patchback.fit.Operator
    input:
      reference_clip_id: {$instance: reference}
      note_sequence_id: 4fa05d30-0000-4000-8000-000000000002
      note_source: Known
      scope: SingleNote
      topology_id: 4fa05d30-0000-4000-8000-000000000003
      seed: 42
      max_renders: 2000
      max_wall_time_ms: 600000
      max_restarts: 4
      improvement_threshold: 0.001
    outcome: started
    events:
      - event: patchback.fit.FitStarted
        payload:
          init: DefaultPatch
    capture: {instance: default, event: patchback.fit.FitStarted, field: fit_run_id}
