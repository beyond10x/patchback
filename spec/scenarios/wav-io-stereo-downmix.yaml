# DESIGN.md 6.1: "mono WAV or stereo WAV downmixed explicitly to mono". The clip records the
# downmix (downmixed: true, source_channel_count: 2); see the UNMAPPED marker on ImportWav about
# whether "explicitly" means an operator opt-in.
type: ess-scenario/1
domain: patchback.audio
scenario: wav-io-stereo-downmix
summary: A stereo 48 kHz float32 file imports as a mono clip that records the downmix from two channels.

arrange:
  - instance: stereo
    entity: patchback.audio.AudioClip

timeline:
  - at: 2026-10-22T09:00:00Z
    command: patchback.audio.ImportWav
    actor: patchback.audio.Operator
    input:
      path: stereo-f32.wav
      origin: PatchbackSynthesized
      sample_rate_hz: 48000
      channel_count: 2
      format_tag: 3
      bits_per_sample: 32
      frame_count: 48000
    outcome: imported-downmixed
    events:
      - event: patchback.audio.ClipImported
        payload:
          source_channel_count: 2
          downmixed: true
    capture: {instance: stereo, event: patchback.audio.ClipImported, field: audio_clip_id}
