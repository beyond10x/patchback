# DESIGN.md 9.2 step 5 and 12.1: no numerically invalid patch is ever offered as a result. A run
# that failed writes no recovered patch: WriteFitResults is refused.
type: ess-scenario/1
domain: patchback.fit
scenario: fit-run-artifacts-failed-run-writes-no-patch
summary: A run that failed on a renderer fault records the failure, and writing its results is refused with FailedRunHasNoPatch.

arrange:
  - instance: reference
    entity: patchback.audio.AudioClip
  - instance: run
    entity: patchback.fit.FitRun

timeline:
  - at: 2026-10-22T00:00:01Z
    command: patchback.patch.DeclareTopology
    actor: patchback.patch.Operator
    input:
      topology_id: 2d8f3b10-0000-4000-8000-000000000103
      name: subtractive-mono/1
      parameters: []
    outcome: declared

  - at: 2026-10-22T00:00:02Z
    command: patchback.patch.LoadPatch
    actor: patchback.patch.Operator
    input:
      patch_id: 2d8f3b10-0000-4000-8000-0000000001f1
      format_version: 1
      sample_rate_hz: 48000
      topology_id: 2d8f3b10-0000-4000-8000-000000000103
      nodes:
        - {id: 2, kind: SawOscillator, parameters: []}
      edges: []
    outcome: loaded

  - at: 2026-10-22T00:00:03Z
    command: patchback.score.LoadNoteSequence
    actor: patchback.score.Operator
    input:
      note_sequence_id: 2d8f3b10-0000-4000-8000-000000000102
      format_version: 1
      sample_rate_hz: 48000
      patch_id: 2d8f3b10-0000-4000-8000-0000000001f1
      notes:
        - {start_sample: 0, end_sample: 24000, midi_note: 45, velocity: 0.8}
    outcome: loaded

  - at: 2026-10-22T00:00:04Z
    command: patchback.audio.ImportWav
    actor: patchback.audio.Operator
    input:
      path: reference.wav
      origin: PatchbackSynthesized
      sample_rate_hz: 48000
      channel_count: 1
      format_tag: 3
      bits_per_sample: 32
      frame_count: 48000
    outcome: imported
    capture: {instance: reference, event: patchback.audio.ClipImported, field: audio_clip_id}

  - at: 2026-10-22T12:10:00Z
    command: patchback.fit.StartFit
    actor: patchback.fit.Operator
    input:
      reference_clip_id: {$instance: reference}
      note_sequence_id: 2d8f3b10-0000-4000-8000-000000000102
      note_source: Known
      scope: SingleNote
      topology_id: 2d8f3b10-0000-4000-8000-000000000103
      seed: 42
      max_renders: 2000
      max_wall_time_ms: 600000
      max_restarts: 4
      improvement_threshold: 0.001
    outcome: started
    capture: {instance: run, event: patchback.fit.FitStarted, field: fit_run_id}

  - at: 2026-10-22T12:10:01Z
    command: patchback.fit.FailFit
    actor: patchback.fit.Optimizer
    input:
      fit_run_id: {$instance: run}
      failure_reason: RendererFault
      wall_time_ms: 1000
    outcome: failed
    events:
      - event: patchback.fit.FitFailed
        payload:
          failure_reason: RendererFault

  - at: 2026-10-22T12:10:02Z
    command: patchback.fit.WriteFitResults
    actor: patchback.fit.Operator
    input:
      fit_run_id: {$instance: run}
      out_dir: results/
      reconstructed_wav_id: 2d8f3b10-0000-4000-8000-000000000130
      warnings: []
    outcome: failed-run
    error:
      name: patchback.fit.FailedRunHasNoPatch
