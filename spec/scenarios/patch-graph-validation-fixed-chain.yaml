# DESIGN.md section 5.2: "The signal-chain topology is fixed": one node of each of NoteInput,
# SawOscillator, Drive, LowpassFilter, AdsrEnvelope, Vca and Output, wired by the seven edges of the
# section 5.2 diagram. A patch with no nodes, and the voice without its Output node (and the edge
# into it), are not that chain and are refused by validation, after the port checks and before the
# cycle check (section 5.1); neither compiles. The default voice is still valid. Which node or edge
# is missing or extra is the validator's (an external outcome, see FixedChainMismatch).
type: ess-scenario/1
domain: patchback.patch
scenario: patch-graph-validation-fixed-chain
summary: A patch with no nodes, or the voice without its Output node, is not the fixed chain and is refused; the default voice is still valid.

