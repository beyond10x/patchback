# epic:patch-studio, fit evolution view, replay. A fit run's evaluations are replayed in order:
# the first valid candidate is retained, a lower loss improves it, a higher one does not, an
# invalid candidate carries no loss (DESIGN.md 9.2 steps 3 and 5). The best loss never rises.
# The trace is closed with the run's end and lists as Closed.
type: ess-scenario/1
domain: patchback.studio
scenario: studio-fit-replay-replayed
summary: Four evaluations of a completed fit run are replayed in order and the closed trace lists with its end.

