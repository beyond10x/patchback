# DESIGN.md section 2 invariant 2 and section 5.2: a contract maps p in [0,1] onto a physical
# domain, so its default is a normalized value in [0,1], its domain is not empty, and an
# exponential mapping (at_zero * (at_one/at_zero)^p) needs a lower end above zero. Paths are
# stable identifiers (section 5.1), so one topology does not declare a path twice; an index is a
# position in the model's normalized target vector (section 5.2), so the indices of n contracts are
# exactly 0..n-1: neither repeated nor outside that range.
# Gap (ESS 0.68.0): a NaN or infinite range end cannot be written in the model's Decimal, and a
# finite range whose width or ratio overflows an f64 does not overflow there; the refusal of both is
# held by crates/patchback-core/tests/parameter_contracts.rs (an_invalid_contract_is_refused_with_a_typed_reason,
# a_range_whose_width_or_ratio_overflows_is_refused).
type: ess-scenario/1
domain: patchback.patch
scenario: parameter-contracts-invalid-contract
summary: A contract with a default outside [0,1], an exponential domain starting at zero, a reversed domain, a repeated path, a repeated index or an index outside 0..n-1 is refused.

