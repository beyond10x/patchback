# DESIGN.md 5.3: "protective output clipping/limiting reported, not silently used to hide
# instability". Whether the limiter engages is the renderer's finding, external to the model.
# The compiled subtractive voice and its note sequence are set up as in
# subtractive-voice-render-renders.
type: ess-scenario/1
domain: patchback.audio
scenario: subtractive-voice-render-limited
summary: A render on which the protective limiter engages succeeds and reports limited true in its event and record.

arrange:
  - instance: hot
    entity: patchback.audio.Render

