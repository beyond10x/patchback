# DESIGN.md 12.2 and 12.3; AGENTS.md: "Fixtures are synthesized by Patchback or carry a recorded
# licence and provenance." An external recording with provenance runs end to end: the fit starts,
# completes, and writes the patch, WAV and report.
type: ess-scenario/1
domain: patchback.fit
scenario: external-audio-acceptance-recording-with-provenance
summary: A fit of an external recording with provenance starts, retains a candidate, completes and writes its results directory.

arrange:
  - instance: reference
    entity: patchback.audio.AudioClip
  - instance: run
    entity: patchback.fit.FitRun
  - instance: results
    entity: patchback.fit.FitResults

timeline:
  - at: 2026-10-22T00:00:01Z
    command: patchback.patch.DeclareTopology
    actor: patchback.patch.Operator
    input:
      topology_id: 7cd38a60-0000-4000-8000-000000000003
      name: subtractive-mono/1
      parameters: []
    outcome: declared

  - at: 2026-10-22T00:00:02Z
    command: patchback.patch.LoadPatch
    actor: patchback.patch.Operator
    input:
      patch_id: 7cd38a60-0000-4000-8000-0000000000f1
      format_version: 1
      sample_rate_hz: 48000
      topology_id: 7cd38a60-0000-4000-8000-000000000003
      nodes:
        - {id: 2, kind: SawOscillator, parameters: []}
      edges: []
    outcome: loaded

  - at: 2026-10-22T00:00:03Z
    command: patchback.score.LoadNoteSequence
    actor: patchback.score.Operator
    input:
      note_sequence_id: 7cd38a60-0000-4000-8000-000000000002
      format_version: 1
      sample_rate_hz: 48000
      patch_id: 7cd38a60-0000-4000-8000-0000000000f1
      notes:
        - {start_sample: 0, end_sample: 24000, midi_note: 45, velocity: 0.8}
    outcome: loaded

  - at: 2026-10-22T00:00:04Z
    command: patchback.audio.ImportWav
    actor: patchback.audio.Operator
    input:
      path: reference.wav
      origin: ExternalRecording
      provenance: recorded by the project from a hardware synthesizer
      licence: CC0-1.0
      sample_rate_hz: 48000
      channel_count: 1
      format_tag: 3
      bits_per_sample: 32
      frame_count: 48000
    outcome: imported
    capture: {instance: reference, event: patchback.audio.ClipImported, field: audio_clip_id}

  - at: 2026-10-22T18:00:00Z
    command: patchback.fit.StartFit
    actor: patchback.fit.Operator
    input:
      reference_clip_id: {$instance: reference}
      note_sequence_id: 7cd38a60-0000-4000-8000-000000000002
      note_source: Known
      scope: SingleNote
      topology_id: 7cd38a60-0000-4000-8000-000000000003
      seed: 42
      max_renders: 2000
      max_wall_time_ms: 600000
      max_restarts: 4
      improvement_threshold: 0.001
    outcome: started
    capture: {instance: run, event: patchback.fit.FitStarted, field: fit_run_id}

  - at: 2026-10-22T18:00:01Z
    command: patchback.fit.EvaluateCandidate
    actor: patchback.fit.Optimizer
    input:
      fit_run_id: {$instance: run}
      patch_id: 7cd38a60-0000-4000-8000-000000000010
      render_id: 7cd38a60-0000-4000-8000-000000000020
      components: {log_spectral: 0.9, envelope: 0.7, transient: 0.6, band_energy: 0.5}
      total_loss: 0.73
    outcome: first-retained

  - at: 2026-10-22T18:00:02Z
    command: patchback.fit.CompleteFit
    actor: patchback.fit.Optimizer
    input:
      fit_run_id: {$instance: run}
      stop_reason: ImprovementBelowThreshold
      wall_time_ms: 2000
    outcome: completed

  - at: 2026-10-22T18:00:03Z
    command: patchback.fit.WriteFitResults
    actor: patchback.fit.Operator
    input:
      fit_run_id: {$instance: run}
      out_dir: external-results/
      reconstructed_wav_id: 7cd38a60-0000-4000-8000-000000000030
      warnings: []
    outcome: written
    capture: {instance: results, event: patchback.fit.FitResultsWritten, field: fit_results_id}
