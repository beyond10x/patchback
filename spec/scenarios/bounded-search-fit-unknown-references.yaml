# DESIGN.md 9.2 and 11 `patchback fit --input reference.wav`: a fit runs against an imported
# reference, a loaded note sequence and a declared topology, and a regressor-seeded fit against an
# analysis of the reference. A fit naming any of them that does not exist is refused and no run
# starts. The weight artifact's existence is not checked (UNMAPPED in fit.yaml, StartFit).
type: ess-scenario/1
domain: patchback.fit
scenario: bounded-search-fit-unknown-references
summary: A fit naming an unknown reference clip, note sequence, topology or analysis is refused with the matching not-found error; no run starts.

arrange:
  - instance: reference
    entity: patchback.audio.AudioClip

timeline:
  - at: 2026-10-22T10:30:00Z
    command: patchback.fit.StartFit
    actor: patchback.fit.Operator
    input:
      reference_clip_id: 0b6e7d1a-0000-4000-8000-000000000401
      note_sequence_id: 0b6e7d1a-0000-4000-8000-000000000402
      note_source: Known
      scope: SingleNote
      topology_id: 0b6e7d1a-0000-4000-8000-000000000403
      seed: 42
      max_renders: 2000
      max_wall_time_ms: 600000
      max_restarts: 4
      improvement_threshold: 0.001
    outcome: unknown-reference
    error:
      name: patchback.fit.ClipNotFound
    no_events: [patchback.fit.FitStarted]

  - at: 2026-10-22T10:30:01Z
    command: patchback.audio.ImportWav
    actor: patchback.audio.Operator
    input:
      path: reference.wav
      origin: PatchbackSynthesized
      sample_rate_hz: 48000
      channel_count: 1
      format_tag: 3
      bits_per_sample: 32
      frame_count: 48000
    outcome: imported
    capture: {instance: reference, event: patchback.audio.ClipImported, field: audio_clip_id}

  - at: 2026-10-22T10:30:02Z
    command: patchback.fit.StartFit
    actor: patchback.fit.Operator
    input:
      reference_clip_id: {$instance: reference}
      note_sequence_id: 0b6e7d1a-0000-4000-8000-000000000402
      note_source: Known
      scope: SingleNote
      topology_id: 0b6e7d1a-0000-4000-8000-000000000403
      seed: 42
      max_renders: 2000
      max_wall_time_ms: 600000
      max_restarts: 4
      improvement_threshold: 0.001
    outcome: unknown-note-sequence
    error:
      name: patchback.fit.NoteSequenceNotFound
      fields:
        note_sequence_id: 0b6e7d1a-0000-4000-8000-000000000402
    no_events: [patchback.fit.FitStarted]

  - at: 2026-10-22T10:30:03Z
    command: patchback.patch.DeclareTopology
    actor: patchback.patch.Operator
    input:
