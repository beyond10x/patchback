# DESIGN.md section 12.1 Graph: "illegal zero-delay cycles ... resource caps"; section 5.4:
# "Unbounded instantaneous cycles are never evaluated"; section 12.3: bound graph size. Cycle
# search and the caps are the validator's (the caps have no value in DESIGN.md, UNMAPPED); the
# provisional caps are MAX_GRAPH_NODES, MAX_GRAPH_EDGES and MAX_VOICES in patchback-core.
# Both patches are the section 5.2 voice plus one fault, because a patch that is not the fixed
# chain is refused for that first (story:patch-review-fixes). The first adds an edge from the
# filter back to the drive. The second adds a second NoteInput, two voices where section 5.2 has
# one: the fixed chain refuses it before the voice cap.
# UNMAPPED: no loaded subtractive-mono/1 patch reaches resource-cap. The chain fixes seven nodes
# and one NoteInput, and MAX_GRAPH_EDGES equals the parser's edge bound (MAX_EDGES), so a patch
# past it is refused by LoadPatch unbounded-length first. The edge cap is held by the Rust test
# caps_a_graph_of_the_edge_cap_passes_the_cap_and_one_more_edge_is_refused on a Patch value.
