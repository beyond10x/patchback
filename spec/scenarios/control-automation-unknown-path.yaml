# DESIGN.md section 10: control events address stable parameter paths of the patch's topology.
# A path that is no parameter contract of the topology is refused; the lookup is the validator's
# (external), so the scenario selects it by name. A negative value is clamped to 0 with a warning
# (section 5.2), not refused.
type: ess-scenario/1
domain: patchback.score
scenario: control-automation-unknown-path
summary: Automation on a path outside the topology's contracts is refused; a negative value is clamped with a warning.

timeline:
  - at: 2026-10-22T09:00:00Z
    command: patchback.patch.DeclareTopology
    actor: patchback.patch.Operator
    input:
      topology_id: 7f0c0000-0000-4000-8000-000000000062
      name: subtractive-mono/1
      parameters: []
    outcome: declared

  - at: 2026-10-22T09:00:01Z
    command: patchback.patch.LoadPatch
    actor: patchback.patch.Operator
    input:
      patch_id: 7f0c0000-0000-4000-8000-000000000162
      format_version: 1
      sample_rate_hz: 48000
      topology_id: 7f0c0000-0000-4000-8000-000000000062
      nodes:
        - {id: 4, kind: LowpassFilter, parameters: []}
      edges: []
    outcome: loaded

  - at: 2026-10-22T09:00:02Z
    command: patchback.score.LoadNoteSequence
    actor: patchback.score.Operator
    input:
      note_sequence_id: 7f0c0000-0000-4000-8000-000000000262
      format_version: 1
      sample_rate_hz: 48000
      patch_id: 7f0c0000-0000-4000-8000-000000000162
      notes:
        - {start_sample: 0, end_sample: 48000, midi_note: 45, velocity: 0.8}
    outcome: loaded

  - at: 2026-10-22T09:00:03Z
    command: patchback.score.AutomateParameters
    actor: patchback.score.Operator
    input:
      note_sequence_id: 7f0c0000-0000-4000-8000-000000000262
      controls:
        - {sample: 0, parameter_path: lfo.rate, normalized_value: 0.5}
    outcome: unknown-path
    error:
      name: patchback.score.UnknownParameterPath
      fields:
        note_sequence_id: 7f0c0000-0000-4000-8000-000000000262
    no_events: [patchback.score.ParametersAutomated]

  - at: 2026-10-22T09:00:04Z
    command: patchback.score.AutomateParameters
    actor: patchback.score.Operator
    input:
      note_sequence_id: 7f0c0000-0000-4000-8000-000000000262
      controls:
        - {sample: 0, parameter_path: filter.cutoff, normalized_value: -0.1}
    outcome: clamped
    events:
      - event: patchback.score.ParametersAutomated
        payload:
          note_sequence_id: 7f0c0000-0000-4000-8000-000000000262
      - event: patchback.score.ControlValuesClamped
        payload:
          note_sequence_id: 7f0c0000-0000-4000-8000-000000000262
