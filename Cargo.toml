[workspace]
members = [
    "crates/patchback-core",
    "crates/patchback-dsp",
    "crates/patchback-audio",
    "crates/patchback-analysis",
    "crates/patchback-dataset",
    "crates/patchback-model",
    "crates/patchback-fit",
    "crates/patchback-cli",
    "crates/patchback-docs",
]
resolver = "3"

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
serde_json = "1"
