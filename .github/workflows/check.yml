name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: patchback / task check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - name: Install go-task
        env:
          TASK_VERSION: "3.52.0"
          TASK_SHA256: 02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/task-bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - name: Install ess
        env:
          ESS_PINNED: "0.68.0"
          ESS_SHA256: 30000c7a9030793a7964997941d6052e09c168fb444b986ca3ed18961465be3f
        run: |
          set -euo pipefail
          ESS_VERSION=$(sed -n 's/^requires: ess //p' spec/ess-inputs.yaml)
          if [ "$ESS_VERSION" != "$ESS_PINNED" ]; then
            echo "spec/ess-inputs.yaml requires ess '$ESS_VERSION'; the checksum here is for $ESS_PINNED" >&2
            exit 1
          fi
          ESS_DIR="ess-$ESS_VERSION-x86_64-unknown-linux-gnu"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$ESS_DIR.tar.gz" \
            "https://github.com/beyond10x/ess/releases/download/$ESS_VERSION/$ESS_DIR.tar.gz"
          echo "$ESS_SHA256  $RUNNER_TEMP/$ESS_DIR.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$ESS_DIR.tar.gz" -C "$RUNNER_TEMP" "$ESS_DIR/ess"
          echo "$RUNNER_TEMP/$ESS_DIR" >> "$GITHUB_PATH"

      - name: Install aep
        env:
          AEP_VERSION: "0.74.0"
          AEP_SHA256: 50b38744290954a345f2c91ee3f22019c36bdc3353c71929db5ec4a638c6f23a
        run: |
          set -euo pipefail
          AEP_DIR="aep-$AEP_VERSION-x86_64-unknown-linux-gnu"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$AEP_DIR.tar.gz" \
            "https://github.com/beyond10x/aep/releases/download/$AEP_VERSION/$AEP_DIR.tar.gz"
          echo "$AEP_SHA256  $RUNNER_TEMP/$AEP_DIR.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$AEP_DIR.tar.gz" -C "$RUNNER_TEMP" "$AEP_DIR/aep"
          echo "$RUNNER_TEMP/$AEP_DIR" >> "$GITHUB_PATH"

      - name: Install modelspec
        run: |
          set -euo pipefail
          MODELSPEC_VERSION=$(sed -n 's/^version //p' models/modelspec.pin)
          MODELSPEC_SHA256=$(sed -n 's/^sha256-x86_64-unknown-linux-gnu //p' models/modelspec.pin)
          if [ -z "$MODELSPEC_VERSION" ] || [ -z "$MODELSPEC_SHA256" ]; then
            echo "models/modelspec.pin names no version or no sha256-x86_64-unknown-linux-gnu" >&2
            exit 1
          fi
          MODELSPEC_ASSET="modelspec-$MODELSPEC_VERSION-x86_64-unknown-linux-gnu"
          MODELSPEC_URL="https://github.com/beyond10x/modelspec/releases/download/$MODELSPEC_VERSION/$MODELSPEC_ASSET"
          mkdir -p "$RUNNER_TEMP/modelspec-bin"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$MODELSPEC_ASSET" "$MODELSPEC_URL"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$MODELSPEC_ASSET.sha256" "$MODELSPEC_URL.sha256"
          RELEASE_SHA256=$(cut -d ' ' -f 1 "$RUNNER_TEMP/$MODELSPEC_ASSET.sha256")
          if [ "$RELEASE_SHA256" != "$MODELSPEC_SHA256" ]; then
            echo "release $MODELSPEC_VERSION publishes sha256 $RELEASE_SHA256; models/modelspec.pin has $MODELSPEC_SHA256" >&2
            exit 1
          fi
          echo "$MODELSPEC_SHA256  $RUNNER_TEMP/$MODELSPEC_ASSET" | sha256sum --check --strict
          install -m 0755 "$RUNNER_TEMP/$MODELSPEC_ASSET" "$RUNNER_TEMP/modelspec-bin/modelspec"
          REPORTED=$("$RUNNER_TEMP/modelspec-bin/modelspec" --version)
          if [ "$REPORTED" != "modelspec $MODELSPEC_VERSION" ]; then
            echo "the downloaded binary reports '$REPORTED'; models/modelspec.pin pins $MODELSPEC_VERSION" >&2
            exit 1
          fi
          echo "$RUNNER_TEMP/modelspec-bin" >> "$GITHUB_PATH"
          echo "PATCHBACK_REQUIRE_MODELSPEC=1" >> "$GITHUB_ENV"

      - name: task check
        env:
          PATCHBACK_SCRATCH: ${{ runner.temp }}/conform
        run: task check
