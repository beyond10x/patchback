name: Documentation validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Install ess
        env:
          ESS_PINNED: "0.69.2"
          ESS_SHA256: 8cc5a3a7ed7c27aacbff131ab1437e18e7d7d1878fee77542b3e0fff7157d414
        run: |
          set -euo pipefail
          ESS_VERSION=$(sed -n 's/^requires: ess //p' spec/ess-inputs.yaml)
          if [ "$ESS_VERSION" != "$ESS_PINNED" ]; then
            echo "spec/ess-inputs.yaml requires ess '$ESS_VERSION'; the checksum here is for $ESS_PINNED" >&2
            exit 1
          fi
          ESS_DIR="ess-$ESS_VERSION-x86_64-unknown-linux-gnu"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$ESS_DIR.tar.gz" \
            "https://github.com/beyond10x/ess/releases/download/$ESS_VERSION/$ESS_DIR.tar.gz"
          echo "$ESS_SHA256  $RUNNER_TEMP/$ESS_DIR.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$ESS_DIR.tar.gz" -C "$RUNNER_TEMP" "$ESS_DIR/ess"
          echo "$RUNNER_TEMP/$ESS_DIR" >> "$GITHUB_PATH"
      - name: Check the generated pages against the specification
        run: |
          cargo test --locked -p patchback-docs
          cargo run --locked -p patchback-docs -- generate --check
      - name: Build the Docusaurus site
        run: npm --prefix website ci --ignore-scripts && npm --prefix website run build
      - name: Bind the built site to its source commit
        run: cargo run --locked -p patchback-docs -- provenance --site website/build --commit "$GITHUB_SHA"
      - name: Upload the exact built site
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: b10x-project-site
          path: website/build
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
