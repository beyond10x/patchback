# DESIGN.md 10 and 13 C: one patch for a phrase, from a note sequence the analysis estimated; the
# estimate's uncertainty goes into the report. The run stores the note source and confidence it
# was started with; report.txt reads them from the run (numeric obligation on the report text).
type: ess-scenario/1
domain: patchback.fit
scenario: phrase-fit-estimated-notes-carry-confidence
summary: A phrase fit from an estimated note sequence with confidence 0.72 starts, retains a first candidate, completes and writes its results.

arrange:
  - instance: reference
    entity: patchback.audio.AudioClip
  - instance: run
    entity: patchback.fit.FitRun
  - instance: results
    entity: patchback.fit.FitResults

timeline:
  - at: 2026-10-22T00:00:01Z
    command: patchback.patch.DeclareTopology
    actor: patchback.patch.Operator
    input:
      topology_id: 5ab16e40-0000-4000-8000-000000000003
      name: subtractive-mono/1
      parameters: []
    outcome: declared

  - at: 2026-10-22T00:00:02Z
    command: patchback.patch.LoadPatch
    actor: patchback.patch.Operator
    input:
      patch_id: 5ab16e40-0000-4000-8000-0000000000f1
      format_version: 1
      sample_rate_hz: 48000
      topology_id: 5ab16e40-0000-4000-8000-000000000003
      nodes:
        - {id: 2, kind: SawOscillator, parameters: []}
      edges: []
    outcome: loaded

  - at: 2026-10-22T00:00:03Z
    command: patchback.score.LoadNoteSequence
    actor: patchback.score.Operator
    input:
      note_sequence_id: 5ab16e40-0000-4000-8000-000000000002
      format_version: 1
      sample_rate_hz: 48000
      patch_id: 5ab16e40-0000-4000-8000-0000000000f1
      notes:
        - {start_sample: 0, end_sample: 24000, midi_note: 45, velocity: 0.8}
    outcome: loaded

  - at: 2026-10-22T00:00:04Z
    command: patchback.audio.ImportWav
    actor: patchback.audio.Operator
    input:
      path: reference.wav
      origin: PatchbackSynthesized
      sample_rate_hz: 48000
      channel_count: 1
      format_tag: 3
      bits_per_sample: 32
      frame_count: 48000
    outcome: imported
    capture: {instance: reference, event: patchback.audio.ClipImported, field: audio_clip_id}

  - at: 2026-10-22T16:00:00Z
    command: patchback.fit.StartFit
    actor: patchback.fit.Operator
    input:
      reference_clip_id: {$instance: reference}
      note_sequence_id: 5ab16e40-0000-4000-8000-000000000002
      note_source: Estimated
      note_confidence: 0.72
      scope: Phrase
      topology_id: 5ab16e40-0000-4000-8000-000000000003
      seed: 42
      max_renders: 6000
      max_wall_time_ms: 1800000
      max_restarts: 4
      improvement_threshold: 0.001
    outcome: started
    capture: {instance: run, event: patchback.fit.FitStarted, field: fit_run_id}

  - at: 2026-10-22T16:00:01Z
    command: patchback.fit.EvaluateCandidate
    actor: patchback.fit.Optimizer
    input:
      fit_run_id: {$instance: run}
      patch_id: 5ab16e40-0000-4000-8000-000000000010
      render_id: 5ab16e40-0000-4000-8000-000000000020
      components: {log_spectral: 0.7, envelope: 0.5, transient: 0.6, band_energy: 0.4}
      total_loss: 0.6
    outcome: first-retained

  - at: 2026-10-22T16:00:02Z
    command: patchback.fit.CompleteFit
    actor: patchback.fit.Optimizer
    input:
      fit_run_id: {$instance: run}
      stop_reason: TimeBudgetExhausted
      wall_time_ms: 1800000
    outcome: completed

  - at: 2026-10-22T16:00:03Z
    command: patchback.fit.WriteFitResults
    actor: patchback.fit.Operator
    input:
      fit_run_id: {$instance: run}
      out_dir: phrase-results/
      reconstructed_wav_id: 5ab16e40-0000-4000-8000-000000000030
      warnings: [note estimate confidence 0.72]
    outcome: written
    capture: {instance: results, event: patchback.fit.FitResultsWritten, field: fit_results_id}
