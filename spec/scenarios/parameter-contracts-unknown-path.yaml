# A path that names no contract of the patch's topology is refused (section 5.1 identifier checks).
# DESIGN.md section 5.2 also says "reject NaN/Infinity"; ESS Decimal holds finite values only (by
# design, beyond10x/ess#676), so that refusal sits at the decoder seam in patchback-core and is held
# by crates/patchback-core/tests/parameter_contracts.rs
# (a_non_finite_value_is_refused_naming_the_parameter), not by a scenario.
type: ess-scenario/1
domain: patchback.patch
scenario: parameter-contracts-unknown-path
summary: A path outside the topology's contracts is refused, whatever the value.

timeline:
  - at: 2026-10-22T09:00:00Z
    command: patchback.patch.DeclareTopology
    actor: patchback.patch.Operator
    input:
      topology_id: 7f0c0000-0000-4000-8000-000000000004
      name: subtractive-mono/1
      parameters:
        - {path: attack, index: 0, unit: Seconds, mapping: Exponential, physical_at_zero: 0.001, physical_at_one: 2, default_normalized: 0.5, clamp: ClampToUnitInterval}
    outcome: declared

  - at: 2026-10-22T09:00:01Z
    command: patchback.patch.LoadPatch
    actor: patchback.patch.Operator
    input:
      patch_id: 7f0c0000-0000-4000-8000-000000000104
      format_version: 1
      sample_rate_hz: 48000
      topology_id: 7f0c0000-0000-4000-8000-000000000004
      nodes:
        - {id: 5, kind: AdsrEnvelope, parameters: [{name: attack, value: 0.01}]}
      edges: []
    outcome: loaded

  - at: 2026-10-22T09:00:02Z
    command: patchback.patch.SetParameter
    actor: patchback.patch.Operator
    input:
      patch_id: 7f0c0000-0000-4000-8000-000000000104
      path: lfo_rate
      normalized_value: 0.5
    outcome: unknown-path
    error:
      name: patchback.patch.UnknownParameterPath
    no_events: [patchback.patch.ParameterSet, patchback.patch.ParameterClamped]
