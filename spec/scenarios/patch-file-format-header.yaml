# DESIGN.md section 11: the .patch format is line-oriented and versioned, and the parser refuses
# an unknown version; section 10 fixes the analysis rate at 48 kHz, so a patch at any other rate
# is refused (unsupported rate). A refused file creates no patch.
type: ess-scenario/1
domain: patchback.patch
scenario: patch-file-format-header
summary: A .patch file with an unknown format version or an unsupported sample rate is refused and no patch is created.

