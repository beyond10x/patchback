    no_events: [patchback.fit.FitStarted]

  - at: 2026-10-22T10:30:07Z
    command: patchback.fit.StartFit
    actor: patchback.fit.Operator
    input:
      reference_clip_id: {$instance: reference}
      note_sequence_id: 0b6e7d1a-0000-4000-8000-000000000402
