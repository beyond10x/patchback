domain: patchback.dataset

summary: >-
  Seeded synthetic training data (DESIGN.md § 7): a dataset generated by rendering known patches,
  its train, validation and test splits, the patch samples in them, the separate diagnostic set of
  rejection cases, and the ModelSpec dense-data files (x.f32, y.f32, order.u32) of each split.

types:
  - name: patchback.dataset.DatasetId
    kind: newtype
    of: Uuid

  - name: patchback.dataset.DatasetSplitId
    kind: newtype
    of: Uuid

  - name: patchback.dataset.DenseDataFileId
    kind: newtype
    of: Uuid

  - name: patchback.dataset.SampleId
    kind: newtype
    of: Uuid

  - name: patchback.dataset.SampledPatchId
    kind: newtype
    of: Uuid

  - name: patchback.dataset.DiagnosticSetId
    kind: newtype
    of: Uuid

  - name: patchback.dataset.DiagnosticExampleId
    kind: newtype
    of: Uuid

  # § 7.1: "Use a local PRNG implemented with `std`; record its algorithm and seed."
  # UNMAPPED: § 7.1 does not name the PRNG algorithm or the spelling of its name. Open question.
  - name: patchback.dataset.PrngAlgorithm
    kind: newtype
    of: String
    naming:
      summary: Name of the std-only PRNG the generator used, recorded with the seed.

  - name: patchback.dataset.SplitRole
    kind: enum
    variants: [Train, Validation, Test]
    naming:
      summary: The three splits of § 7.1, decided by patch seed/identity.

  - name: patchback.dataset.DiagnosticKind
    kind: enum
    variants: [Silence, Noise, Clipping]
    naming:
      summary: The rejection cases § 7.1 places in the separate diagnostic set.

  # § 7.2: x.f32 (N × 32), y.f32 (N × 8), optional order.u32.
  - name: patchback.dataset.DenseFileKind
    kind: enum
    variants: [X, Y, Order]
    naming:
      summary: x.f32 (N × 32 features), y.f32 (N × 8 targets), order.u32 (sample indices).

# UNMAPPED: DESIGN.md specifies no delete of a dataset, a split or a diagnostic set, so nothing
# says whether their samples, examples and dense files are owned (deleted with the parent) or
# referenced. Every link is declared `references`, from the child side, because ESS 0.67.0
# synthesizes no scenario for a guard comparing the `via:` field of an `owns` relation
# (ESS-SYNTH-003). The ownership question stays open for the owner.
entities:
  - name: patchback.dataset.Dataset
    naming:
      summary: >-
        One run of `patchback generate-dataset` (§ 11): paired (x, y) examples rendered from
        seeded patches through the same DSP engine and the `features/1` contract (§ 7.1).
    identity:
      name: dataset_id
      type: patchback.dataset.DatasetId
    fields:
      - name: seed
        type: Integer
        summary: The PRNG seed (`--seed`), recorded so the dataset can be regenerated.
      - name: prng_algorithm
        type: patchback.dataset.PrngAlgorithm
      - name: batch_size
        type: Integer
        summary: The initial ModelSpec minibatch size every split count divides (16, § 7.1).
      - name: feature_contract_id
        type: patchback.analysis.FeatureContractId
      - name: topology_id
        type: patchback.patch.TopologyId
        summary: The fixed signal-chain topology the patches were sampled in (§ 5.2).
      - name: out_dir
        type: String
    relations:
      - name: feature_contract
        kind: references
        target: patchback.analysis.FeatureContract
        cardinality: one
        via: feature_contract_id
      - name: topology
        kind: references
        target: patchback.patch.Topology
        cardinality: one
        via: topology_id
      # UNMAPPED: § 6.3 saves training-set means and standard deviations as an internal artifact
      # (patchback.analysis.NormalizationStats) and § 7 does not say which record holds the link:
      # the dataset, its train split, or the stats themselves. Open question.
    lifecycle:
      initial: Generated
      states: [Generated]
      terminal: [Generated]

  - name: patchback.dataset.DatasetSplit
    naming:
      summary: >-
        One split of a dataset (train 50,016, validation 4,992, test 4,992 in § 7.1), decided by
        patch seed/identity. Written once its x.f32 and y.f32 are verified.
    identity:
      name: dataset_split_id
      type: patchback.dataset.DatasetSplitId
    fields:
      - name: dataset_id
        type: patchback.dataset.DatasetId
      - name: role
        type: patchback.dataset.SplitRole
      - name: sample_count
        type: Integer
        summary: The number of (x, y) rows of the split; each of its dense files has this many rows.
    # UNMAPPED: § 7.1 does not say whether a dataset may hold two splits of one role. Open question.
    relations:
      - name: dataset
        kind: references
        target: patchback.dataset.Dataset
        cardinality: one
        via: dataset_id
    lifecycle:
      initial: Open
      states: [Open, Written]
      terminal: [Written]
      transitions:
        - name: write
          from: [Open]
          to: Written

  # § 7.1: "Train/validation/test split by patch seed/identity, not by rendering the same patch at
  # different notes and placing copies across splits." The sampled patch is drawn into exactly one
  # split; every rendering (Sample) names the patch, never a split, so its split is the patch's.
  - name: patchback.dataset.SampledPatch
    naming:
      summary: >-
        One valid normalized patch sampled by the seeded generator (§ 7.1), drawn into one split of
        one dataset. Its seed is its identity within the dataset.
    identity:
      name: sampled_patch_id
      type: patchback.dataset.SampledPatchId
    fields:
      - name: dataset_id
        type: patchback.dataset.DatasetId
      - name: dataset_split_id
        type: patchback.dataset.DatasetSplitId
      - name: patch_seed
        type: Integer
        summary: Seed/identity of the sampled patch.
    relations:
      - name: dataset
        kind: references
        target: patchback.dataset.Dataset
        cardinality: one
        via: dataset_id
      - name: split
        kind: references
        target: patchback.dataset.DatasetSplit
        cardinality: one
        via: dataset_split_id
    lifecycle:
      initial: Drawn
      states: [Drawn]
      terminal: [Drawn]

  - name: patchback.dataset.Sample
    naming:
      summary: >-
        One (x: [32], y: [8]) pair rendered from one sampled patch and one-note program (§ 7.1);
        pitch and gate duration are kept as metadata. Its split is its patch's split.
    identity:
      name: sample_id
      type: patchback.dataset.SampleId
    fields:
      - name: sampled_patch_id
        type: patchback.dataset.SampledPatchId
      - name: midi_note
        type: Integer
      - name: gate_samples
        type: Integer
        summary: Gate duration in samples at the patch sample rate (§ 10).
    # UNMAPPED: § 7.1 asks for notes and note lengths "within a declared training distribution"
    # and does not declare it (pitch range, gate range). No range refusal is modelled. Open question.
    relations:
      - name: patch
        kind: references
        target: patchback.dataset.SampledPatch
        cardinality: one
        via: sampled_patch_id
    lifecycle:
      initial: Rendered
      states: [Rendered]
      terminal: [Rendered]

  # § 7.1: "include silence/noise/clipping rejection cases in a separate diagnostic set". The set
  # is its own entity, not a fourth split role, so a diagnostic example cannot name a split and a
  # sample cannot name the diagnostic set: separation is held by the identity types.
  # UNMAPPED: whether the diagnostic set is written as dense data, and whether its size is bound
  # to the batch size. With this model it has no dense files. Open question.
  - name: patchback.dataset.DiagnosticSet
    naming:
      summary: The diagnostic set of silence, noise and clipping rejection cases of one dataset (§ 7.1).
    identity:
      name: diagnostic_set_id
      type: patchback.dataset.DiagnosticSetId
    fields:
      - name: dataset_id
        type: patchback.dataset.DatasetId
    relations:
      - name: dataset
        kind: references
        target: patchback.dataset.Dataset
        cardinality: one
        via: dataset_id
    lifecycle:
      initial: Open
      states: [Open]
      terminal: [Open]

  - name: patchback.dataset.DiagnosticExample
    naming:
      summary: One silence, noise or clipping rejection case in the diagnostic set (§ 7.1).
    identity:
      name: diagnostic_example_id
      type: patchback.dataset.DiagnosticExampleId
    fields:
      - name: diagnostic_set_id
        type: patchback.dataset.DiagnosticSetId
      - name: kind
        type: patchback.dataset.DiagnosticKind
    relations:
      - name: diagnostic_set
        kind: references
        target: patchback.dataset.DiagnosticSet
        cardinality: one
        via: diagnostic_set_id
    lifecycle:
      initial: Rendered
      states: [Rendered]
      terminal: [Rendered]

  - name: patchback.dataset.DenseDataFile
    naming:
      summary: >-
        A ModelSpec dense-data file of one split (§ 7.2): row-major little-endian f32 (x.f32,
        y.f32) or u32 (order.u32), verified for byte count, sample count and finite values.
    identity:
      name: dense_data_file_id
      type: patchback.dataset.DenseDataFileId
    fields:
      - name: dataset_split_id
        type: patchback.dataset.DatasetSplitId
      - name: kind
        type: patchback.dataset.DenseFileKind
      - name: path
        type: String
      - name: rows
        type: Integer
      - name: columns
        type: Integer
      - name: byte_count
        type: Integer
    # UNMAPPED: § 7.2 calls order.u32 "a checked sequence of sample indices" and does not say what
    # the check is (a permutation of 0..N, indices below N, or a length of N). Open question; no
    # refusal is modelled for it.
    relations:
      - name: split
        kind: references
        target: patchback.dataset.DatasetSplit
        cardinality: one
        via: dataset_split_id
    lifecycle:
      initial: Verified
      states: [Verified]
      terminal: [Verified]

actors:
  - name: patchback.dataset.Operator
    naming:
      display: Operator
      summary: The person or CI job running the `patchback` CLI (§ 11).
    may:
      - patchback.dataset.GenerateDataset
      - patchback.dataset.OpenSplit
      - patchback.dataset.DrawPatch
      - patchback.dataset.AddSample
      - patchback.dataset.OpenDiagnosticSet
      - patchback.dataset.AddDiagnosticExample
      - patchback.dataset.WriteDenseFile
      - patchback.dataset.FinishSplit

errors:
  - name: patchback.dataset.SplitCountNotBatchMultiple
    summary: >-
      The split's sample count is not a multiple of the dataset's batch size (§ 7.1), so no split
      was opened.
    fields:
      - name: role
        type: patchback.dataset.SplitRole
      - name: sample_count
        type: Integer
      - name: batch_size
        type: Integer

  - name: patchback.dataset.UnknownDataset
    summary: No dataset carries this identity.
    fields:
      - name: dataset_id
        type: patchback.dataset.DatasetId

  - name: patchback.dataset.UnknownSplit
    summary: No split carries this identity.
    fields:
      - name: dataset_split_id
        type: patchback.dataset.DatasetSplitId

  - name: patchback.dataset.UnknownDiagnosticSet
    summary: No diagnostic set carries this identity.
    fields:
      - name: diagnostic_set_id
        type: patchback.dataset.DiagnosticSetId

  - name: patchback.dataset.PatchAlreadyDrawn
    summary: >-
      This patch seed is already drawn into a split of the dataset; a patch belongs to one split,
      and its renderings are never placed across splits (§ 7.1).
    fields:
      - name: patch_seed
        type: Integer
      - name: dataset_split_id
        type: patchback.dataset.DatasetSplitId

  - name: patchback.dataset.UnknownPatch
    summary: No drawn patch carries this identity.
    fields:
      - name: sampled_patch_id
        type: patchback.dataset.SampledPatchId

  - name: patchback.dataset.SplitAlreadyWritten
    summary: The split's dense data is already written, so nothing changed.
    fields:
      - name: state
        type: patchback.dataset.DatasetSplit.State

  - name: patchback.dataset.WrongColumnCount
    summary: x.f32 rows hold 32 values, y.f32 rows 8, order.u32 rows 1 (§ 7.2).
    fields:
      - name: kind
        type: patchback.dataset.DenseFileKind
      - name: columns
        type: Integer

  - name: patchback.dataset.SampleCountMismatch
    summary: >-
      The file's row count differs from the split's sample count, so x and y would not pair up
      (§ 7.2).
    fields:
      - name: rows
        type: Integer
      - name: sample_count
        type: Integer

  - name: patchback.dataset.ByteCountMismatch
    summary: The file's byte count is not rows × columns × 4 (§ 7.2).
    fields:
      - name: byte_count
        type: Integer
      - name: rows
        type: Integer
      - name: columns
        type: Integer

  - name: patchback.dataset.NonFiniteValue
    summary: An f32 value is NaN or Infinity (§ 7.2), so the file is refused.
    fields:
      - name: kind
        type: patchback.dataset.DenseFileKind

  - name: patchback.dataset.MissingDenseFile
    summary: A split is written only once both its x.f32 and its y.f32 are verified (§ 7.2).
    fields:
      - name: dataset_split_id
        type: patchback.dataset.DatasetSplitId

commands:
  - name: patchback.dataset.GenerateDataset
    naming:
      wire: generate-dataset
      display: Generate a dataset
      summary: >-
        `patchback generate-dataset --seed <seed> --samples <n> --out <dir>` (§ 11): records the
        PRNG algorithm and seed, the batch size, the feature contract and the topology.
    # UNMAPPED: § 11's `--samples 60000` is one total and § 7.1 gives three split counts
    # (50,016 / 4,992 / 4,992) that are no simple ratio of it; nothing says how the CLI derives
    # the split counts from `--samples`. Here each split's count is given to OpenSplit.
    input:
      - name: seed
        type: Integer
        example: 42
      - name: prng_algorithm
        type: patchback.dataset.PrngAlgorithm
      - name: batch_size
        type: Integer
        example: 16
      - name: feature_contract_id
        type: patchback.analysis.FeatureContractId
      - name: topology_id
        type: patchback.patch.TopologyId
      - name: out_dir
        type: String
    outcomes:
      - name: generated
        creates: patchback.dataset.Dataset
        instance: dataset_id
        sets:
          seed: input.seed
          prng_algorithm: input.prng_algorithm
          batch_size: input.batch_size
          feature_contract_id: input.feature_contract_id
          topology_id: input.topology_id
          out_dir: input.out_dir
        emits: [patchback.dataset.DatasetGenerated]
        payload:
          patchback.dataset.DatasetGenerated:
            dataset_id: {generated: true}
            seed: input.seed
            prng_algorithm: input.prng_algorithm
        summary: The dataset exists with its seed and PRNG algorithm recorded.

  - name: patchback.dataset.OpenSplit
    naming:
      wire: open-split
      display: Open a split
      summary: Open the train, validation or test split of a dataset with its sample count.
    input:
      - name: dataset_id
        type: patchback.dataset.DatasetId
      - name: role
        type: patchback.dataset.SplitRole
      - name: sample_count
        type: Integer
        example: 4992
    outcomes:
      - name: unknown-dataset
        when_related:
          via: input.dataset_id
          exists: false
        error: patchback.dataset.UnknownDataset
        payload:
          patchback.dataset.UnknownDataset:
            dataset_id: input.dataset_id
      # ESS predicates have no remainder operator, so the multiple-of-batch-size rule is an
      # external decision: the implementation computes sample_count mod batch_size. A count of
      # zero or below is refused the same way (0 is a multiple; § 7.1 gives positive counts).
      - name: count-not-batch-multiple
        external: sample_count is not a positive multiple of the dataset's batch_size
        error: patchback.dataset.SplitCountNotBatchMultiple
        payload:
          patchback.dataset.SplitCountNotBatchMultiple:
            role: input.role
            sample_count: input.sample_count
            batch_size: {related: {via: input.dataset_id, field: batch_size}}
      - name: opened
        creates: patchback.dataset.DatasetSplit
        instance: dataset_split_id
        sets:
          dataset_id: input.dataset_id
          role: input.role
          sample_count: input.sample_count
        emits: [patchback.dataset.SplitOpened]
        payload:
          patchback.dataset.SplitOpened:
            dataset_split_id: {generated: true}
            dataset_id: input.dataset_id
            role: input.role
            sample_count: input.sample_count
        summary: The split is open and holds no samples yet.

  - name: patchback.dataset.DrawPatch
    naming:
      wire: draw-patch
      display: Draw a patch
      summary: >-
        Sample one valid normalized patch from the seeded generator and assign it to one train,
        validation or test split of the dataset (§ 7.1).
    # Gap (ESS 0.67.0): one command reads one kind of related row, and the patch-identity rule
    # needs a row set over SampledPatch, so an unknown dataset_split_id, or a split of another
    # dataset, is not refused here (a row-set count below 1 has no witness, ESS-SYNTH-001).
    input:
      - name: dataset_id
        type: patchback.dataset.DatasetId
      - name: dataset_split_id
        type: patchback.dataset.DatasetSplitId
      - name: patch_seed
        type: Integer
    outcomes:
      - name: patch-already-drawn
        when_related:
          entity: patchback.dataset.SampledPatch
          where:
            all:
              - dataset_id == input.dataset_id
              - patch_seed == input.patch_seed
          count: {gte: 1}
        error: patchback.dataset.PatchAlreadyDrawn
        payload:
          patchback.dataset.PatchAlreadyDrawn:
            patch_seed: input.patch_seed
            dataset_split_id: input.dataset_split_id
      - name: drawn
        creates: patchback.dataset.SampledPatch
        instance: sampled_patch_id
        sets:
          dataset_id: input.dataset_id
          dataset_split_id: input.dataset_split_id
          patch_seed: input.patch_seed
        emits: [patchback.dataset.PatchDrawn]
        payload:
          patchback.dataset.PatchDrawn:
            sampled_patch_id: {generated: true}
            dataset_split_id: input.dataset_split_id
            patch_seed: input.patch_seed
        summary: The patch exists in exactly one split; every rendering of it stays there.

  - name: patchback.dataset.AddSample
    naming:
      wire: add-sample
      display: Add a sample
      summary: Record one rendering (x, y pair) of a drawn patch at one note and gate duration.
    input:
      - name: sampled_patch_id
        type: patchback.dataset.SampledPatchId
      - name: midi_note
        type: Integer
        example: 60
      - name: gate_samples
        type: Integer
        example: 24000
    outcomes:
      - name: unknown-patch
        when_related:
          via: input.sampled_patch_id
          exists: false
        error: patchback.dataset.UnknownPatch
        payload:
          patchback.dataset.UnknownPatch:
            sampled_patch_id: input.sampled_patch_id
      - name: added
        creates: patchback.dataset.Sample
        instance: sample_id
        sets:
          sampled_patch_id: input.sampled_patch_id
          midi_note: input.midi_note
          gate_samples: input.gate_samples
        emits: [patchback.dataset.SampleAdded]
        payload:
          patchback.dataset.SampleAdded:
            sample_id: {generated: true}
            sampled_patch_id: input.sampled_patch_id
        summary: The pair is in its patch's split.

  - name: patchback.dataset.OpenDiagnosticSet
    naming:
      wire: open-diagnostic-set
      display: Open the diagnostic set
      summary: Open the separate diagnostic set of a dataset (§ 7.1).
    input:
      - name: dataset_id
        type: patchback.dataset.DatasetId
    outcomes:
      - name: unknown-dataset
        when_related:
          via: input.dataset_id
          exists: false
        error: patchback.dataset.UnknownDataset
        payload:
          patchback.dataset.UnknownDataset:
            dataset_id: input.dataset_id
      - name: opened
        creates: patchback.dataset.DiagnosticSet
        instance: diagnostic_set_id
        sets:
          dataset_id: input.dataset_id
        emits: [patchback.dataset.DiagnosticSetOpened]
        payload:
          patchback.dataset.DiagnosticSetOpened:
            diagnostic_set_id: {generated: true}
            dataset_id: input.dataset_id
        summary: The diagnostic set exists apart from the train, validation and test splits.

  - name: patchback.dataset.AddDiagnosticExample
    naming:
      wire: add-diagnostic-example
      display: Add a diagnostic example
      summary: Record one silence, noise or clipping rejection case in the diagnostic set.
    input:
      - name: diagnostic_set_id
        type: patchback.dataset.DiagnosticSetId
      - name: kind
        type: patchback.dataset.DiagnosticKind
    outcomes:
      - name: unknown-diagnostic-set
        when_related:
          via: input.diagnostic_set_id
          exists: false
        error: patchback.dataset.UnknownDiagnosticSet
        payload:
          patchback.dataset.UnknownDiagnosticSet:
            diagnostic_set_id: input.diagnostic_set_id
      - name: added
        creates: patchback.dataset.DiagnosticExample
        instance: diagnostic_example_id
        sets:
          diagnostic_set_id: input.diagnostic_set_id
          kind: input.kind
        emits: [patchback.dataset.DiagnosticExampleAdded]
        payload:
          patchback.dataset.DiagnosticExampleAdded:
            diagnostic_example_id: {generated: true}
            diagnostic_set_id: input.diagnostic_set_id
            kind: input.kind
        summary: The rejection case is in the diagnostic set.

  - name: patchback.dataset.WriteDenseFile
    naming:
      wire: write-dense-file
      display: Write a dense-data file
      summary: >-
        Write and verify one ModelSpec dense-data file of a split (§ 7.2): column count, row
        count against the split, byte count, finite values.
    input:
      - name: dataset_split_id
        type: patchback.dataset.DatasetSplitId
      - name: kind
        type: patchback.dataset.DenseFileKind
      - name: path
        type: String
      - name: rows
        type: Integer
        example: 4992
      - name: columns
        type: Integer
        example: 32
      - name: byte_count
        type: Integer
        example: 638976
    outcomes:
      - name: wrong-column-count
        when:
          any:
            - all: [kind == X, columns != 32]
            - all: [kind == Y, columns != 8]
            - all: [kind == Order, columns != 1]
        error: patchback.dataset.WrongColumnCount
        payload:
          patchback.dataset.WrongColumnCount:
            kind: input.kind
            columns: input.columns
      - name: unknown-split
        when_related:
          via: input.dataset_split_id
          exists: false
        error: patchback.dataset.UnknownSplit
        payload:
          patchback.dataset.UnknownSplit:
            dataset_split_id: input.dataset_split_id
      - name: sample-count-mismatch
        when_related:
          via: input.dataset_split_id
          predicate: sample_count != input.rows
        error: patchback.dataset.SampleCountMismatch
        payload:
          patchback.dataset.SampleCountMismatch:
            rows: input.rows
            sample_count: {related: {via: input.dataset_split_id, field: sample_count}}
      # ESS predicates have no multiplication, so the byte-count rule is an external decision.
      - name: byte-count-mismatch
        external: byte_count is not rows × columns × 4
        error: patchback.dataset.ByteCountMismatch
        payload:
          patchback.dataset.ByteCountMismatch:
            byte_count: input.byte_count
            rows: input.rows
            columns: input.columns
      - name: non-finite-value
        external: an x.f32 or y.f32 value is NaN or Infinity
        error: patchback.dataset.NonFiniteValue
        payload:
          patchback.dataset.NonFiniteValue:
            kind: input.kind
      - name: written
        creates: patchback.dataset.DenseDataFile
        instance: dense_data_file_id
        sets:
          dataset_split_id: input.dataset_split_id
          kind: input.kind
          path: input.path
          rows: input.rows
          columns: input.columns
          byte_count: input.byte_count
        emits: [patchback.dataset.DenseFileWritten]
        payload:
          patchback.dataset.DenseFileWritten:
            dense_data_file_id: {generated: true}
            dataset_split_id: input.dataset_split_id
            kind: input.kind
            rows: input.rows
        summary: The file is written, row-major little-endian, and verified.

  - name: patchback.dataset.FinishSplit
    naming:
      wire: finish-split
      display: Finish a split's dense data
      summary: Mark a split's dense data written once its x.f32 and y.f32 are verified (§ 7.2).
    input:
      - name: dataset_split_id
        type: patchback.dataset.DatasetSplitId
    outcomes:
      - name: unknown-split
        unknown_instance: true
        error: patchback.dataset.UnknownSplit
        payload:
          patchback.dataset.UnknownSplit:
            dataset_split_id: input.dataset_split_id
      # Gap (ESS 0.67.0): "no verified x.f32 or no verified y.f32 of this split" is a row-set
      # count below 1, which has no witness (ESS-SYNTH-001), and naming both files as inputs reads
      # two rows of one entity, which synthesis cannot arrange (ESS-SYNTH-003). So the rule is an
      # external decision and nothing in the model checks it.
      - name: missing-dense-file
        external: the split has no verified x.f32 or no verified y.f32
        error: patchback.dataset.MissingDenseFile
        payload:
          patchback.dataset.MissingDenseFile:
            dataset_split_id: input.dataset_split_id
      - name: written
        moves: patchback.dataset.DatasetSplit.write
        instance: dataset_split_id
        emits: [patchback.dataset.SplitWritten]
        payload:
          patchback.dataset.SplitWritten:
            dataset_split_id: input.dataset_split_id
        summary: The split's dense data is complete and may be given to `modelspec train`.
      - name: wrong-state
        wrong_state: true
        error: patchback.dataset.SplitAlreadyWritten
        payload:
          patchback.dataset.SplitAlreadyWritten:
            state: {subject: state}

