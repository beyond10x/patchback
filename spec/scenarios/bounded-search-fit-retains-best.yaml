# DESIGN.md 9.2 step 3: "coordinate search ..., retaining only improvements"; 12.1 Optimization:
# "never worsens retained best candidate". The first valid candidate is retained, a strictly
# lower loss replaces it, a higher and an equal loss do not, and an invalid candidate is counted
# without replacing it (9.2 step 5).
type: ess-scenario/1
domain: patchback.fit
scenario: bounded-search-fit-retains-best
summary: The retained best candidate is replaced only by a strictly lower loss; worse, equal and invalid candidates leave it unchanged.

arrange:
  - instance: reference
    entity: patchback.audio.AudioClip
  - instance: run
    entity: patchback.fit.FitRun

